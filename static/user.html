<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3a9d5d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>打卡树 · 用户端</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script>
    // 安卓适配：env(safe-area-inset-bottom) 在部分 WebView/Expo 下不可靠，
    // 用 visualViewport 实测底部被遮挡的高度，写入 CSS 变量 --safe-b 兜底。
    (function () {
      function applySafe() {
        var vpt = window.visualViewport || { height: window.innerHeight, offsetTop: 0 };
        var gap = window.innerHeight - vpt.height;
        var safe = Math.max(gap, 0);
        // 至少给安卓手势条留 24px（env() 在 WebView 里常常为 0）
        if (safe < 12 && /android/i.test(navigator.userAgent)) safe = 24;
        document.documentElement.style.setProperty("--safe-b", safe + "px");
        // 顶部安全区：用 visualViewport.offsetTop 或状态栏估算
        var safeT = Math.max(vpt.offsetTop || 0, 0);
        if (/android/i.test(navigator.userAgent) && safeT < 8) safeT = 0;
        document.documentElement.style.setProperty("--safe-t", safeT + "px");
      }
      applySafe();
      window.addEventListener("resize", applySafe);
      window.addEventListener("visualViewport", "scroll"); // 占位防报错
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", applySafe);
      }
    })();
  </script>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <h1 id="pageTitle">🌳 Woods</h1>
      <button id="logoutBtn" class="hidden" onclick="logout()">退出</button>
    </div>

    <div class="screen page active" id="pageWoods"></div>
    <div class="screen page" id="pageSeed"></div>

    <div class="tabbar" id="tabbar">
      <button id="tabWoods" class="active" onclick="switchTab('woods')">
        <span class="ico">🌳</span><span>Woods</span>
      </button>
      <button id="tabSeed" onclick="switchTab('seed')">
        <span class="ico">🌱</span><span>Seed</span>
      </button>
    </div>
  </div>

  <script src="/static/api.js"></script>
  <script>
    const TK = "tree_user_token";
    const pageWoods = document.getElementById("pageWoods");
    const pageSeed = document.getElementById("pageSeed");
    const pageTitle = document.getElementById("pageTitle");
    const logoutBtn = document.getElementById("logoutBtn");
    let curTab = "woods";
    let me = null;
    let allTargets = [];      // 全部目标（前端做分页）
    let curPage = 0;          // 当前页码
    const PAGE_SIZE = 4;      // 每页4个目标

    function treeStage(rate) {
      if (rate <= 0)   return { emoji: "🌰", name: "种子" };
      if (rate < 0.15) return { emoji: "🌱", name: "嫩芽" };
      if (rate < 0.4)  return { emoji: "🌿", name: "幼苗" };
      if (rate < 0.7)  return { emoji: "☘️", name: "小树" };
      return { emoji: "🌳", name: "大树" };
    }

    function switchTab(tab) {
      curTab = tab;
      const isWoods = tab === "woods";
      document.getElementById("tabWoods").classList.toggle("active", isWoods);
      document.getElementById("tabSeed").classList.toggle("active", !isWoods);
      pageWoods.classList.toggle("active", isWoods);
      pageSeed.classList.toggle("active", !isWoods);
      pageTitle.innerHTML = isWoods ? "🌳 Woods" : "🌱 Seed";
      if (!isWoods) renderSeed();
    }

    // =================== 手机验证码登录 ===================
    let codeCountdown = 0;
    function renderAuth() {
      logoutBtn.classList.add("hidden");
      document.getElementById("tabbar").style.display = "none";
      pageWoods.classList.add("active"); pageSeed.classList.remove("active");
      pageTitle.textContent = "🌳 打卡树";
      pageWoods.innerHTML = `
        <div class="card accent" style="margin-top:20px">
          <div style="text-align:center;font-size:54px;margin-bottom:6px">🌳</div>
          <h3 style="text-align:center;margin-bottom:4px">欢迎来到打卡树</h3>
          <p class="meta" style="text-align:center;margin-top:0">输入手机号，开始种树</p>
          <label>手机号</label>
          <input id="phoneInput" type="tel" maxlength="11" placeholder="请输入 11 位手机号" inputmode="numeric" />
          <label>验证码</label>
          <div style="display:flex;gap:8px">
            <input id="codeInput" type="text" maxlength="6" placeholder="6 位验证码" inputmode="numeric" style="flex:1" />
            <button class="btn secondary" id="sendCodeBtn" style="width:auto;margin-top:0;padding:0 16px;white-space:nowrap;font-size:14px" onclick="sendCode()">获取验证码</button>
          </div>
          <p class="meta" id="codeHint" style="margin-top:10px;font-size:12px;color:var(--primary-dark);min-height:18px"></p>
          <button class="btn" onclick="doPhoneLogin()">登录 / 注册</button>
          <p class="hint">未注册手机号将自动注册</p>
        </div>`;
      codeCountdown = 0;
    }

    async function sendCode() {
      const phone = document.getElementById("phoneInput").value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) return toast("请输入正确的手机号");
      const btn = document.getElementById("sendCodeBtn");
      btn.disabled = true;
      try {
        const res = await api("/users/send-code", { method: "POST", body: { phone } });
        // 模拟环境：后端把验证码返回了，直接展示给用户
        const code = res.data[0].code;
        document.getElementById("codeHint").textContent = `【模拟短信】你的验证码是：${code}`;
        toast("验证码已发送");
        // 倒计时
        codeCountdown = 60;
        const tick = () => {
          if (codeCountdown <= 0) { btn.disabled = false; btn.textContent = "获取验证码"; return; }
          btn.textContent = `${codeCountdown}s`;
          codeCountdown--; setTimeout(tick, 1000);
        };
        tick();
      } catch (e) {
        btn.disabled = false;
        toast(e.message);
      }
    }

    async function doPhoneLogin() {
      const phone = document.getElementById("phoneInput").value.trim();
      const code = document.getElementById("codeInput").value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) return toast("请输入正确的手机号");
      if (code.length !== 6) return toast("请输入6位验证码");
      try {
        const res = await api("/users/phone-login", { method: "POST", body: { phone, code } });
        TokenStore.set(TK, res.data[0].token);
        toast(res.message);
        enterApp();
      } catch (e) { toast(e.message); }
    }

    async function enterApp() {
      logoutBtn.classList.remove("hidden");
      document.getElementById("tabbar").style.display = "";
      const token = TokenStore.get(TK);
      try {
        const r = await api("/users/tokenlogin", { method: "POST", token });
        me = r.data[0];
      } catch (e) { toast("登录已过期，请重新登录"); return logout(); }
      switchTab("woods");
      renderWoods();
    }

    // =================== Woods 页：分页式目标 ===================
    async function renderWoods() {
      const token = TokenStore.get(TK);
      try {
        const res = await api("/targets/query?offset=0&limit=100", { token });
        allTargets = res.data;
      } catch (e) { toast("登录已过期"); return logout(); }

      const totalPages = Math.max(1, Math.ceil(allTargets.length / PAGE_SIZE));
      if (curPage >= totalPages) curPage = totalPages - 1;
      if (curPage < 0) curPage = 0;

      let html = "";
      if (!allTargets.length) {
        html += `<div class="empty"><span class="ico">🌱</span>你的森林还是空地<br>种下第一个目标，开始养成吧</div>`;
      } else {
        const start = curPage * PAGE_SIZE;
        const pageItems = allTargets.slice(start, start + PAGE_SIZE);
        html += `<div class="section-title"><span class="dot"></span>我的森林 · 共 ${allTargets.length} 棵</div>`;
        html += `<div class="swipe-hint">👈 右滑卡片可 置顶 / 删除</div>`;
        for (const t of pageItems) html += renderCompactCard(t);
        // 分页器
        html += renderPager(totalPages);
      }
      html += `<button class="btn fab" onclick="renderForm()">＋ 种下一棵新树</button>`;
      pageWoods.innerHTML = html;
      bindSwipe();
    }

    function renderCompactCard(t) {
      const total = Math.max(daysBetween(t.start_time, t.deadline_time), 1);
      const rate = Math.min((t.current_day || 0) / total, 1);
      const stage = treeStage(rate);
      const remaining = remainingDays(t.deadline_time);
      const pinFlag = t.pinned ? `<span class="pin-flag">📌 置顶</span>` : "";
      return `
        <div class="swipe-wrap" data-id="${t.id}">
          <div class="swipe-actions">
            <button class="act-pin" onclick="pinTarget(${t.id})"><span class="ico">📌</span>置顶</button>
            <button class="act-del" onclick="delFromSwipe(${t.id})"><span class="ico">🗑</span>删除</button>
          </div>
          <div class="swipe-card compact" onclick="openTarget(${t.id})">
            <div class="tree-hero-mini">
              <div class="tree-emoji-mini">${stage.emoji}</div>
              <div class="compact-info">
                <div class="compact-name">${escapeHtml(t.name)}${pinFlag}</div>
                <div class="compact-meta">已打卡 ${t.current_day||0} 天 · ${stage.name}${remaining!==null?` · 剩 ${remaining} 天`:""}</div>
                <div class="compact-bar"><span style="width:${(rate*100).toFixed(0)}%"></span></div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderPager(totalPages) {
      if (totalPages <= 1) return "";
      let dots = "";
      for (let i = 0; i < totalPages; i++) {
        dots += `<span class="dot ${i===curPage?'active':''}"></span>`;
      }
      return `
        <div class="pager">
          <button onclick="goPage(${curPage-1})" ${curPage===0?'disabled':''}>‹</button>
          <div class="page-info">${curPage+1} / ${totalPages}</div>
          <button onclick="goPage(${curPage+1})" ${curPage===totalPages-1?'disabled':''}>›</button>
        </div>`;
    }
    function goPage(p) { curPage = p; renderWoods(); }

    // ---------- 右滑手势 ----------
    function bindSwipe() {
      document.querySelectorAll(".swipe-wrap").forEach(wrap => {
        const card = wrap.querySelector(".swipe-card");
        let startX = 0, curX = 0, dragging = false, opened = false;
        const ACTION_W = 156; // 两个按钮宽度

        card.addEventListener("touchstart", e => {
          if (e.target.closest("button")) return;
          // 若点击的是其它已打开卡片，先关掉
          startX = e.touches[0].clientX; dragging = true;
          card.style.transition = "none";
        }, { passive: true });

        card.addEventListener("touchmove", e => {
          if (!dragging) return;
          curX = e.touches[0].clientX - startX;
          let base = opened ? -ACTION_W : 0;
          let offset = base + curX;
          offset = Math.max(-ACTION_W, Math.min(0, offset));
          card.style.transform = `translateX(${offset}px)`;
        }, { passive: true });

        card.addEventListener("touchend", () => {
          if (!dragging) return;
          dragging = false;
          card.style.transition = "transform .25s ease";
          // 滑过半阈值则打开，否则关闭
          let base = opened ? -ACTION_W : 0;
          let real = base + curX;
          if (!opened && real < -ACTION_W/2.5) { opened = true; card.style.transform = `translateX(${-ACTION_W}px)`; }
          else if (opened && real > -ACTION_W + ACTION_W/2.5) { opened = false; card.style.transform = `translateX(0)`; }
          else { card.style.transform = `translateX(${opened?-ACTION_W:0}px)`; }
        });

        // 点击空白关闭其它打开的卡片
        card._closeSwipe = () => { opened = false; card.style.transition="transform .25s ease"; card.style.transform = "translateX(0)"; };
      });
    }

    // ---------- 点开单个目标详情 ----------
    function openTarget(id) {
      const t = allTargets.find(x => x.id === id);
      if (!t) return;
      const total = Math.max(daysBetween(t.start_time, t.deadline_time), 1);
      const rate = Math.min((t.current_day||0)/total,1);
      const stage = treeStage(rate);
      const remaining = remainingDays(t.deadline_time);
      pageWoods.innerHTML = `
        <button class="btn secondary btn-sm" style="width:auto;margin:0 0 12px" onclick="renderWoods()">← 返回</button>
        <div class="card">
          <div class="tree-hero" style="margin:-18px -18px 14px;border-radius:var(--r-md) var(--r-md) 0 0">
            <div class="tree-emoji">${stage.emoji}</div>
            <div class="tree-name">${escapeHtml(t.name)} ${t.pinned?'<span class="pin-flag">📌</span>':''}</div>
            <span class="tree-stage">${stage.name} · 已打卡 ${t.current_day||0} 天</span>
            <div class="progress"><span style="width:${(rate*100).toFixed(0)}%"></span></div>
          </div>
          <div class="meta">🗓 ${fmt(t.start_time)} → ${fmt(t.deadline_time)}<br>⏰ 提醒：${fmt(t.remind_time)}${remaining!==null?`<br>⏳ 距截止还有 <b>${remaining}</b> 天`:""}</div>
          <div class="btn-row">
            <button class="btn" onclick="renderCheckin(${t.id}, '${escapeAttr(t.name)}')">📷 打卡</button>
            <button class="btn secondary" onclick='renderForm(${JSON.stringify(t).replace(/'/g,"&#39;")})'>✏️</button>
          </div>
          <div style="text-align:center;margin-top:10px"><a href="#" onclick="loadStats(${t.id});return false;" style="font-size:13px;color:var(--primary-dark);font-weight:600">查看成长档案 →</a></div>
        </div>`;
    }

    // ---------- 置顶 / 删除（从右滑按钮触发） ----------
    async function pinTarget(id) {
      const t = allTargets.find(x=>x.id===id);
      try {
        await api(`/targets/${t.pinned?'unpin':'pin'}/${id}`, { method: "POST", token: TokenStore.get(TK) });
        toast(t.pinned ? "已取消置顶" : "已置顶到第一页");
        curPage = 0; // 置顶后回到第一页第一条
        renderWoods();
      } catch (e) { toast(e.message); }
    }
    async function delFromSwipe(id) {
      if (!confirm("确定砍掉这棵树？🪓")) return;
      try {
        await api(`/targets/delete/${id}`, { method: "POST", token: TokenStore.get(TK) });
        toast("已删除"); renderWoods();
      } catch (e) { toast(e.message); }
    }

    // ---------- 打卡 ----------
    function renderCheckin(targetId, targetName) {
      pageWoods.innerHTML = `
        <button class="btn secondary btn-sm" style="width:auto;margin:0 0 12px" onclick="renderWoods()">← 返回</button>
        <div class="card">
          <h3>📷 为「${escapeHtml(targetName)}」打卡</h3>
          <p class="meta" style="margin:4px 0 10px">上传一张打卡证据图片</p>
          <input type="file" id="proofFile" accept="image/*" style="display:none" onchange="onPickProof(this)" />
          <div class="upload-area" onclick="document.getElementById('proofFile').click()"><span class="ico">🖼️</span>点击选择图片（≤5MB）</div>
          <img id="proofPreview" class="img-preview hidden" />
          <p class="meta" id="uploadHint" style="margin-top:8px"></p>
          <button class="btn" id="checkinBtn" onclick="submitCheckin(${targetId})" disabled>✅ 完成打卡</button>
        </div>`;
      window._pickedUrl = null;
    }
    async function onPickProof(input) {
      const file = input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => { const img = document.getElementById("proofPreview"); img.src = e.target.result; img.classList.remove("hidden"); };
      reader.readAsDataURL(file);
      document.getElementById("uploadHint").textContent = "正在上传…";
      try {
        const url = await uploadFile(file, TokenStore.get(TK));
        window._pickedUrl = url;
        document.getElementById("uploadHint").innerHTML = `<span style="color:var(--primary-dark)">✓ 上传成功</span>`;
        document.getElementById("checkinBtn").disabled = false;
      } catch (e) { document.getElementById("uploadHint").innerHTML = `<span style="color:var(--berry)">上传失败：${escapeHtml(e.message)}</span>`; }
    }
    async function submitCheckin(id) {
      if (!window._pickedUrl) return toast("请先选择图片");
      try {
        await api(`/days/add/${id}`, { method: "POST", token: TokenStore.get(TK), body: { day_proof: window._pickedUrl } });
        toast("🎉 打卡成功！"); renderWoods();
      } catch (e) { toast(e.message); }
    }

    // ---------- 成长档案 ----------
    async function loadStats(targetId) {
      try {
        const res = await getStats(targetId, TokenStore.get(TK));
        const s = res.data[0]; const ratePct = (s.completion_rate*100).toFixed(0);
        const stage = treeStage(s.completion_rate);
        const cal = s.calendar.length ? `<div class="meta" style="margin-top:8px">📅 ${s.calendar.map(d=>"·"+d.slice(5)).join(" ")}</div>` : "";
        pageWoods.innerHTML = `
          <button class="btn secondary btn-sm" style="width:auto;margin:0 0 12px" onclick="openTarget(${targetId})">← 返回</button>
          <div class="card">
            <div class="tree-hero" style="margin:-18px -18px 16px"><div class="tree-emoji">${stage.emoji}</div><div class="tree-name">${escapeHtml(s.target_name)}</div><span class="tree-stage">${stage.name}</span></div>
            <div class="stat-grid"><div class="stat-cell"><div class="num">${s.total_checked}</div><div class="lab">已打卡</div></div><div class="stat-cell"><div class="num sun">🔥${s.streak}</div><div class="lab">连续天数</div></div><div class="stat-cell"><div class="num">${ratePct}%</div><div class="lab">完成率</div></div></div>
            <div class="progress" style="margin-top:16px"><span style="width:${ratePct}%"></span></div>
            <div class="meta" style="margin-top:12px">🌳 应打卡 ${s.expected_days} 天 · 已完成 ${s.total_checked} 天<br>${s.remaining_days!==null?`⏳ 距截止还有 ${s.remaining_days} 天`:""}</div>${cal}
          </div>`;
      } catch (e) { toast(e.message); }
    }

    // ---------- 新建 / 修改 ----------
    function renderForm(target) {
      const editing = !!target;
      const now = new Date();
      const plus = (d) => { const x = new Date(now); x.setDate(x.getDate()+d); return x; };
      const v = {
        name: editing ? target.name : "",
        start: editing ? target.start_time.slice(0,16) : toLocalInput(now),
        deadline: editing ? target.deadline_time.slice(0,16) : toLocalInput(plus(30)),
        remind: editing ? target.remind_time.slice(0,16) : toLocalInput(plus(1)),
      };
      pageWoods.innerHTML = `
        <button class="btn secondary btn-sm" style="width:auto;margin:0 0 12px" onclick="renderWoods()">← 返回</button>
        <div class="card">
          <h3>${editing?"✏️ 修剪这棵树":"🌱 种下一棵新树"}</h3>
          <label>目标名称</label><input id="t_name" value="${escapeAttr(v.name)}" placeholder="例如：每天跑步5公里" />
          <label>开始时间</label><input id="t_start" type="datetime-local" value="${v.start}" />
          <label>截止时间</label><input id="t_deadline" type="datetime-local" value="${v.deadline}" />
          <label>提醒时间</label><input id="t_remind" type="datetime-local" value="${v.remind}" />
          <button class="btn" onclick="saveTarget(${editing?target.id:"null"})">${editing?"保存修改":"🌱 提交种植"}</button>
          <button class="btn secondary" onclick="renderWoods()">取消</button>
        </div>`;
    }
    async function saveTarget(id) {
      const token = TokenStore.get(TK);
      const body = {
        name: document.getElementById("t_name").value.trim(),
        start_time: document.getElementById("t_start").value,
        deadline_time: document.getElementById("t_deadline").value,
        remind_time: document.getElementById("t_remind").value,
      };
      if (!body.name) return toast("请填写目标名称");
      try {
        if (id === null) { await api("/targets/add", { method:"POST", token, body }); toast("已种下 🌱"); }
        else { body.update_field = ["name","start_time","deadline_time","remind_time"]; await api(`/targets/update/${id}`, { method:"POST", token, body }); toast("已修改"); }
        renderWoods();
      } catch (e) { toast(e.message); }
    }

    // =================== Seed 页 ===================
    async function renderSeed() {
      if (!me) return;
      const token = TokenStore.get(TK);
      let totalChecked=0, bestStreak=0, totalTrees=0;
      try {
        const res = await api("/targets/query?offset=0&limit=100", { token });
        totalTrees = res.data.length;
        for (const t of res.data) {
          try { const st = await getStats(t.id, token); const s = st.data[0]; totalChecked += s.total_checked; if (s.streak>bestStreak) bestStreak=s.streak; } catch(e){}
        }
        var forest = res.data.map(t => treeStage(Math.min((t.current_day||0)/Math.max(daysBetween(t.start_time,t.deadline_time),1),1)).emoji).join(" ");
      } catch (e) {}
      pageSeed.innerHTML = `
        <div class="card accent" style="margin-top:8px;text-align:center">
          <div style="font-size:60px">🧑‍🌾</div>
          <h3 style="margin:8px 0 4px">${escapeHtml(me.name||"")}</h3>
          <div class="meta">${me.phone ? "📱 "+maskPhone(me.phone) : ""}</div>
        </div>
        <div class="section-title"><span class="dot"></span>我的数据</div>
        <div class="stat-grid">
          <div class="stat-cell"><div class="num">${totalTrees}</div><div class="lab">树木总数</div></div>
          <div class="stat-cell"><div class="num">${totalChecked}</div><div class="lab">累计打卡</div></div>
          <div class="stat-cell"><div class="num sun">🔥${bestStreak}</div><div class="lab">最长连续</div></div>
        </div>
        <div class="section-title"><span class="dot"></span>我的森林</div>
        <div class="card" style="text-align:center;font-size:30px;letter-spacing:5px;min-height:56px;line-height:1.6">${forest||"（空地，去 Woods 种树吧）"}</div>
        <button class="btn danger" onclick="logout()">🚪 退出登录</button>
        <p class="hint">打卡树 · 让坚持像种树一样生长 🌳</p>`;
    }

    // ---------- 工具 ----------
    function daysBetween(a,b){ if(!a||!b) return 1; return Math.ceil((new Date(b)-new Date(a))/86400000); }
    function remainingDays(d){ if(!d) return null; const x=Math.ceil((new Date(d)-new Date())/86400000); return x>0?x:0; }
    function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    function escapeAttr(s){ return escapeHtml(s); }
    function maskPhone(p){ return p ? p.slice(0,3)+"****"+p.slice(7) : ""; }

    function logout() { TokenStore.clear(TK); me=null; renderAuth(); }

    if (TokenStore.get(TK)) enterApp(); else renderAuth();
  </script>
</body>
</html>
