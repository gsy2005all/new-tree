<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#237a3f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>打卡树 · 管理端</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="phone">
    <div class="topbar" style="background:#237a3f">
      <h1>🛡️ 审核后台 <span class="sub" id="who"></span></h1>
      <button id="logoutBtn" class="hidden" onclick="logout()">退出</button>
    </div>
    <div class="screen" id="screen"></div>
  </div>

  <script src="/static/api.js"></script>
  <script>
    const TK = "tree_admin_token";   // 管理端 token 的存储 key（与用户端互不干扰）
    const screen = document.getElementById("screen");
    const whoEl = document.getElementById("who");
    const logoutBtn = document.getElementById("logoutBtn");
    let curFilter = "pending";       // 当前筛选的审核状态

    // ---------- 登录（仅管理员可进） ----------
    function renderAuth() {
      whoEl.textContent = "";
      logoutBtn.classList.add("hidden");
      screen.innerHTML = `
        <div class="card">
          <h3>管理员登录</h3>
          <label>用户名</label>
          <input id="name" placeholder="管理员账号" />
          <label>密码</label>
          <input id="pwd" type="password" placeholder="密码" />
          <button class="btn" onclick="doLogin()">登录</button>
          <p class="hint">提示：先用 <code>python manage.py set-admin &lt;用户名&gt;</code> 设管理员，再用该账号登录</p>
        </div>`;
    }
    async function doLogin() {
      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("pwd").value;
      if (!name || !password) return toast("请填写用户名和密码");
      try {
        const res = await api("/users/login", { method: "POST", body: { name, password } });
        if (res.data[0].role !== "admin") return toast("该账号不是管理员");
        TokenStore.set(TK, res.data[0].token);
        whoEl.textContent = res.data[0].name;
        renderList();
      } catch (e) { toast(e.message); }
    }

    // ---------- 审核列表 ----------
    async function renderList() {
      logoutBtn.classList.remove("hidden");
      const token = TokenStore.get(TK);
      let targets = [];
      try {
        const q = curFilter === "all" ? "" : `&status=${curFilter}`;
        const res = await api(`/admin/targets?offset=0&limit=100${q}`, { token });
        targets = res.data;
      } catch (e) { toast("登录已过期或无权限"); return logout(); }

      const tab = (key, label) =>
        `<button class="${curFilter === key ? "active" : ""}" onclick="setFilter('${key}')">${label}</button>`;

      let html = `
        <div class="tabs">
          ${tab("pending", "待审核")}${tab("approved", "已通过")}${tab("rejected", "已驳回")}${tab("all", "全部")}
        </div>
        <button class="btn" onclick="aiAll()">🤖 一键 AI 审核所有待审目标</button>`;

      if (!targets.length) {
        html += `<div class="empty">该分类下暂无目标</div>`;
      } else {
        for (const t of targets) {
          const who = t.audited_by === null && t.audit_status !== "pending" ? "（AI 自动审核）"
                    : t.audited_by ? `（管理员#${t.audited_by}）` : "";
          const reason = t.audit_reason ? `<br>审核意见：${t.audit_reason}${who}` : "";
          html += `
            <div class="card">
              <h3>${t.name} <span class="badge ${t.audit_status}">${STATUS_TEXT[t.audit_status]}</span></h3>
              <div class="meta">
                提交用户ID：${t.creater_user_id} · 目标ID：${t.id}<br>
                开始：${fmt(t.start_time)} → 截止：${fmt(t.deadline_time)}<br>
                提醒：${fmt(t.remind_time)}${reason}
              </div>
              <div class="btn-row">
                <button class="btn" onclick="review(${t.id}, true)">通过</button>
                <button class="btn danger" onclick="review(${t.id}, false)">驳回</button>
                <button class="btn secondary" onclick="aiOne(${t.id})">🤖 AI判断</button>
              </div>
            </div>`;
        }
      }
      screen.innerHTML = html;
    }

    function setFilter(f) { curFilter = f; renderList(); }

    // 人工审核
    async function review(id, approved) {
      let reason = "";
      if (!approved) {
        reason = prompt("请填写驳回原因：", "内容需更具体");
        if (reason === null) return;
      } else {
        reason = "管理员人工通过";
      }
      try {
        await api(`/admin/targets/${id}/review`, {
          method: "POST", token: TokenStore.get(TK), body: { approved, reason },
        });
        toast(approved ? "已通过" : "已驳回");
        renderList();
      } catch (e) { toast(e.message); }
    }

    // 单个 AI 审核
    async function aiOne(id) {
      try {
        const res = await api(`/admin/targets/${id}/ai-review`, { method: "POST", token: TokenStore.get(TK) });
        const t = res.data[0];
        toast(`AI 判定：${STATUS_TEXT[t.audit_status]} — ${t.audit_reason}`);
        renderList();
      } catch (e) { toast(e.message); }
    }

    // 批量 AI 审核
    async function aiAll() {
      try {
        const res = await api("/admin/targets/ai-review-pending", { method: "POST", token: TokenStore.get(TK) });
        toast(`已自动审核 ${res.total} 个待审目标`);
        renderList();
      } catch (e) { toast(e.message); }
    }

    function logout() { TokenStore.clear(TK); renderAuth(); }

    if (TokenStore.get(TK)) renderList(); else renderAuth();
  </script>
</body>
</html>
